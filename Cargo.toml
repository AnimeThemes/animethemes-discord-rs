[package]
name = "animethemes-discord-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
cynic = "3.14.0"
cynic-codegen = "3.14"
dotenvy = "0.15.7"
graphql_client = "0.16.0"
indexmap = "2.14.2"
poise = "0.7.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"]}
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[build-dependencies]
cynic-codegen = "3.14"
